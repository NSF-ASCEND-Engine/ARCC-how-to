project:
  type: book
  output-dir: _book

book:
  title: "Getting Started on ARCC MedicineBow"
  subtitle: "A practical onboarding guide for ASCEND / ARID researchers"
  author: "Rallypoint One"
  date: last-modified
  search: true
  repo-url: https://github.com/RallypointOne/ARCC-how-to
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "Built for ASCEND/ARID performers. Not an official ARCC document."
    right: "Corrections → arcc-help@uwyo.edu"
  chapters:
    - index.qmd
    - chapters/01-getting-started.qmd
    - chapters/02-linux-essentials.qmd
    - chapters/03-storage-and-data.qmd
    - chapters/04-software.qmd
    - chapters/05-running-jobs.qmd
    - chapters/06-partitions-qos-queues.qmd
    - chapters/07-working-with-jobs.qmd
    - chapters/08-preemption-and-failures.qmd
    - chapters/09-reference.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    df-print: kable
    callout-appearance: simple
    link-external-newwindow: true
